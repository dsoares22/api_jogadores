services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bd_jogadores
      POSTGRES_USER: jogadores
      POSTGRES_PASSWORD: jogadores
    ports:
      - "${DB_PORT:-5433}:5432"   # 5433 no seu Mac para não conflitar com o PostgreSQL local
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jogadores -d bd_jogadores"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/bd_jogadores
      SPRING_DATASOURCE_USERNAME: jogadores
      SPRING_DATASOURCE_PASSWORD: jogadores
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: "./frontend_api_jogadores "
      args:
        VITE_API_URL: http://localhost:${BACKEND_PORT:-8080}
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend

volumes:
  db_data:
